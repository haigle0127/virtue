spring:
  profiles:
    active: local
  main:
    allow-bean-definition-overriding: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
  web:
    resources:
      static-locations: classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/
  aop:
    proxy-target-class: true
  messages:
    basename: i18n/message
    encoding: UTF-8
server:
  port: 9981
  tomcat:
      uri-encoding: utf-8
mybatis-plus:
  type-aliases-package: cn.haigle.virtue.mapper.dataobject.*
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    banner: true

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    enabled: true
    path: /v3/api-docs
  group-configs:
    - group: admin
      display-name: 管理端接口
      packages-to-scan: cn.haigle.virtue.controller.admin
    - group: app
      display-name: App端接口
      packages-to-scan: cn.haigle.virtue.controller.app

knife4j:
  enable: true
  setting:
    language: zh_cn
