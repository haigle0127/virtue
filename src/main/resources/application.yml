spring:
  profiles:
    active: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
  web:
    resources:
      static-locations: classpath:/static/
  aop:
    proxy-target-class: true
  messages:
    basename: i18n/message
    encoding: UTF-8
server:
  port: 9981
  tomcat:
      uri-encoding: utf-8
mybatis-plus:
  type-aliases-package: cn.haigle.virtue.mapper.dataobject.*
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    banner: true
sa-token:
  token-style: tik
  token-prefix: Bearer
  token-name: Authorization
#  timeout: 86400
#  active-timeout: -1
#  is-share: false
#  token-style: random-128
#  is-concurrent: false
# Knife4j 配置
knife4j:
  enable: true
  openapi:
    header:
      name: Authorization
      default-value: "Bearer test1"
      description: "用于认证的 token"